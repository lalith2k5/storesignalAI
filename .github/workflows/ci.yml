name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew deps
        run: brew install python@3.11 make cmake libomp

      - name: Install uv
        run: brew install uv

      - name: Install project
        run: uv venv --python 3.11 .venv && uv pip install -e ".[dev]"

      - name: Generate synthetic data
        run: .venv/bin/python scripts/make_synthetic_data.py

      - name: Run full pipeline
        run: |
          .venv/bin/python scripts/build_unified.py
          .venv/bin/python scripts/train_baseline.py
          .venv/bin/python scripts/run_detection.py
          .venv/bin/python scripts/run_evaluation.py

      - name: Run tests
        run: .venv/bin/pytest tests/ -v

      - name: Verify Evidence gate
        run: |
          .venv/bin/python -c "
          import json
          r = json.load(open('reports/evaluation.json'))
          assert r['macro_f1_category']['macro_f1'] > 0.5, 'macro-F1 below 0.5'
          assert r['escalation_precision']['precision'] > 0.8, 'escalation precision below 0.8'
          assert all(x['detected'] for x in r['detection_lead_time']), 'missed a seeded incident'
          print('All gates pass.')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            reports/evaluation.json
            reports/evaluation.md
