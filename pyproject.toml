[project]
name = "storesignal-ai"
version = "1.0.0"
description = "Multilingual retail operations early-warning and incident-resolution intelligence system"
requires-python = "==3.11.*"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "networkx>=3.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "typer>=0.12",
    "rich>=13.7",
    "joblib>=1.4",
]

[project.optional-dependencies]
transformers = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "transformers>=4.42",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storesignal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
